<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BP Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e6ebf1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262a30" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>BP Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root {
  --bg: #e6ebf1;
  --hi: #ffffff;
  --lo: #bec7d4;
  --text: #2b3445;
  --muted: #8a94a6;
  --accent: #4d78f5;
  --accent2: #3a63e0;
  --dia: #9a7cf0;
  --raise: 9px 9px 18px var(--lo), -9px -9px 18px var(--hi);
  --raise-sm: 5px 5px 10px var(--lo), -5px -5px 10px var(--hi);
  --inset: inset 5px 5px 10px var(--lo), inset -5px -5px 10px var(--hi);
  --inset-sm: inset 3px 3px 6px var(--lo), inset -3px -3px 6px var(--hi);
  --c-normal: #2fbf71;
  --danger: #e5484d;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #262a30;
    --hi: #31363e;
    --lo: #1a1d21;
    --text: #e6e9ef;
    --muted: #8b94a4;
    --accent: #6b8fff;
    --accent2: #5579f0;
    --dia: #b19bff;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  touch-action: manipulation;
  overscroll-behavior-y: none;
  min-height: 100dvh;
  font-variant-numeric: tabular-nums;
  -webkit-user-select: none;
  user-select: none;
}
input, textarea { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }

main {
  max-width: 480px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 112px);
}
.view { display: none; }
.view.on { display: block; animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

header.top {
  display: flex; align-items: center; justify-content: space-between;
  min-height: 52px; margin: 4px 2px 22px;
}
h1 { font-size: 32px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
.sub { color: var(--muted); font-size: 15px; font-weight: 600; margin-top: 2px; }

.card {
  background: var(--bg);
  border-radius: 28px;
  box-shadow: var(--raise);
  padding: 20px;
  margin-bottom: 22px;
}

/* number entry */
.nums { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.num label {
  display: block; text-align: center;
  font-size: 13px; font-weight: 800; letter-spacing: .08em;
  color: var(--muted); margin-bottom: 10px;
}
.num label small { font-weight: 700; letter-spacing: 0; opacity: .8; }
.num input {
  width: 100%; height: 92px;
  border: 0; outline: 0; border-radius: 22px;
  background: var(--bg); box-shadow: var(--inset);
  color: var(--text);
  font: 800 44px/1 ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  text-align: center; padding: 0;
  -webkit-appearance: none; appearance: none;
  caret-color: var(--accent);
  transition: box-shadow .2s;
}
.num input::placeholder { color: var(--muted); opacity: .35; }
.num input:focus { box-shadow: var(--inset), 0 0 0 2px var(--accent); }
.num.sys input { color: var(--accent); }
.num.dia input { color: var(--dia); }
.bad { animation: shake .35s; }
.bad input, input.bad { box-shadow: var(--inset), 0 0 0 2px var(--danger) !important; }
@keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }

.chiprow { height: 34px; display: flex; justify-content: center; align-items: center; margin-top: 16px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 14px; border-radius: 99px;
  box-shadow: var(--raise-sm);
  font-size: 14px; font-weight: 800;
  opacity: 0; transform: scale(.9); transition: opacity .2s, transform .2s;
}
.chip.on { opacity: 1; transform: none; }

.field {
  width: 100%; height: 56px;
  border: 0; outline: 0; border-radius: 18px;
  background: var(--bg); box-shadow: var(--inset-sm);
  color: var(--text);
  font: 600 17px ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  padding: 0 18px;
  -webkit-appearance: none; appearance: none;
  display: block;
}
.field::placeholder { color: var(--muted); }
input[type="datetime-local"].field { text-align: left; line-height: 56px; }
input[type="datetime-local"]::-webkit-date-and-time-value { text-align: left; }
.row2 { display: grid; gap: 14px; margin-top: 18px; }

.btn {
  height: 62px; width: 100%;
  border-radius: 22px;
  background: var(--bg); box-shadow: var(--raise-sm);
  font-size: 18px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: box-shadow .15s, transform .15s;
}
.btn:active { box-shadow: var(--inset-sm); transform: scale(.985); }
.btn.primary {
  color: #fff;
  background: linear-gradient(145deg, var(--accent), var(--accent2));
  box-shadow: var(--raise-sm);
}
.btn.primary:active { box-shadow: inset 4px 4px 8px rgba(0,0,0,.22), inset -3px -3px 8px rgba(255,255,255,.12); }
.btn.danger { color: var(--danger); }
.save { margin-top: 22px; }

.last { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.last .k { font-size: 13px; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
.last .v { font-size: 30px; font-weight: 800; margin-top: 4px; }
.last .v span { color: var(--muted); font-size: 16px; font-weight: 700; margin-left: 6px; }
.last .when { color: var(--muted); font-size: 14px; font-weight: 600; margin-top: 2px; }

/* round icon button */
.ibtn {
  height: 50px; padding: 0 18px; border-radius: 99px;
  box-shadow: var(--raise-sm);
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 16px; font-weight: 800; color: var(--accent);
  transition: box-shadow .15s;
}
.ibtn:active { box-shadow: var(--inset-sm); }
.ibtn svg { width: 20px; height: 20px; }

/* segmented */
.seg {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  padding: 6px; border-radius: 20px; box-shadow: var(--inset-sm);
  margin-bottom: 22px;
}
.seg button {
  height: 42px; border-radius: 15px;
  font-size: 15px; font-weight: 800; color: var(--muted);
  transition: box-shadow .2s, color .2s;
}
.seg button.on { box-shadow: var(--raise-sm); color: var(--accent); }

.stats { display: grid; grid-template-columns: 1.4fr 1fr 1fr; text-align: center; }
.stats > div + div { border-left: 1px solid color-mix(in srgb, var(--lo) 55%, transparent); }
.stats .k { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
.stats .v { font-size: 26px; font-weight: 800; margin-top: 6px; }
.stats .v small { font-size: 13px; color: var(--muted); font-weight: 700; }

.chart { padding: 16px 12px 8px; }
#chart { display: block; width: 100%; height: 200px; overflow: visible; touch-action: pan-y; cursor: pointer; }
.chead { display: flex; justify-content: space-between; align-items: center; padding: 2px 8px 12px; }
.chead .u { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.legend { display: flex; gap: 14px; font-size: 12px; font-weight: 700; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.cdetail { padding: 14px 8px 0; min-height: 40px; }
.cdetail .dt { font-size: 17px; font-weight: 800; }
.cdetail .ds { font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 3px; }
.chips {
  display: flex; gap: 12px; overflow-x: auto;
  margin: 0 -12px; padding: 16px 12px 18px;
  scroll-snap-type: x proximity; scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.cp { flex: none; scroll-snap-align: start; min-width: 100px; padding: 10px 14px; border-radius: 16px; box-shadow: var(--raise-sm); }
.cp .ct { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.cp .cv { font-size: 21px; font-weight: 800; margin-top: 3px; }
.cp .cpu { font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.cp .cpu svg { width: 11px; height: 11px; margin-right: 3px; vertical-align: -1px; }

.day { font-size: 14px; font-weight: 800; color: var(--muted); margin: 26px 6px 12px; letter-spacing: .02em; }
.day:first-child { margin-top: 4px; }
.rec {
  margin-bottom: 14px; border-radius: 22px; box-shadow: var(--raise-sm);
  transition: box-shadow .3s ease, transform .3s cubic-bezier(.34,1.4,.64,1);
}
.rec:has(.item:active) { transform: scale(.975); }
.rec.open { box-shadow: var(--inset-sm); }
.item {
  width: 100%; text-align: left;
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px; border-radius: 22px;
}
.racts {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows .34s cubic-bezier(.2,.9,.25,1);
}
.rec.open .racts { grid-template-rows: 1fr; }
.racts > div { min-height: 0; overflow: hidden; }
.racts .row { display: flex; justify-content: flex-end; gap: 16px; padding: 6px 18px 18px; }
.racts .ico {
  opacity: 0; transform: translateY(-10px) scale(.5);
  transition: opacity .18s ease, transform .18s ease;
}
.rec.open .racts .ico {
  opacity: 1; transform: none;
  transition: opacity .25s ease .08s, transform .42s cubic-bezier(.34,1.56,.64,1) .08s;
}
.rec.open .racts .ico.del { transition-delay: .15s; }
@media (prefers-reduced-motion: reduce) {
  .racts, .racts .ico, .rec { transition: none !important; }
}
.ico {
  width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center;
  box-shadow: var(--raise-sm); color: var(--accent);
  transition: box-shadow .15s;
}
.ico:active { box-shadow: var(--inset-sm); }
.ico svg { width: 22px; height: 22px; }
.ico.del { color: var(--danger); }

.confirm {
  position: fixed; z-index: 22; left: 50%; top: 50%;
  width: min(calc(100% - 48px), 360px);
  transform: translate(-50%, -46%) scale(.96); opacity: 0; pointer-events: none;
  transition: transform .22s ease, opacity .22s ease;
  background: var(--bg); border-radius: 28px; padding: 26px 20px 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,.25);
  text-align: center;
}
.confirm.on { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
.confirm h2 { margin: 0; font-size: 21px; font-weight: 800; }
.confirm p { margin: 6px 0 22px; color: var(--muted); font-weight: 700; font-size: 15px; }
.confirm .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.btn.danger-fill { color: #fff; background: var(--danger); }
.item .bp { font-size: 24px; font-weight: 800; min-width: 92px; }
.item .meta { flex: 1; min-width: 0; }
.item .t { font-size: 15px; font-weight: 700; }
.item .n { font-size: 14px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.item .p { font-size: 15px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.item .p svg { width: 13px; height: 13px; vertical-align: -1px; margin-right: 3px; }
.empty { text-align: center; color: var(--muted); font-weight: 700; padding: 40px 0; }

/* account */
.me {
  width: 50px; height: 50px; border-radius: 50%; flex: none; position: relative;
  box-shadow: var(--raise-sm); font-size: 20px; font-weight: 800; color: var(--accent);
  transition: box-shadow .15s;
}
.me:active { box-shadow: var(--inset-sm); }
.me.pending::after {
  content: ""; position: absolute; top: 2px; right: 2px;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--muted); border: 2px solid var(--bg);
}
.welcome {
  position: fixed; inset: 0; z-index: 40; background: var(--bg);
  display: flex; justify-content: center; align-items: flex-start;
  padding: calc(env(safe-area-inset-top) + 11vh) 28px 0;
}
.welcome[hidden] { display: none; }
.wbox { width: 100%; max-width: 380px; text-align: center; animation: fade .3s ease; }
.logo {
  width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 34px;
  display: grid; place-items: center; box-shadow: var(--raise); color: var(--accent);
}
.logo svg { width: 46px; height: 46px; }
.wbox h1 { margin-bottom: 26px; font-size: 28px; }
.wbox .field { height: 64px; text-align: center; font-size: 21px; font-weight: 700; }
.wbox .btn { margin-top: 22px; }
.btn:disabled { opacity: .6; }

/* tab bar */
nav.tabs {
  position: fixed; z-index: 10;
  left: 50%; transform: translateX(-50%);
  bottom: max(14px, env(safe-area-inset-bottom));
  width: min(calc(100% - 36px), 444px);
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  padding: 8px; border-radius: 30px;
  background: var(--bg); box-shadow: var(--raise);
}
nav.tabs button {
  height: 58px; border-radius: 23px;
  display: flex; align-items: center; justify-content: center; gap: 9px;
  font-size: 16px; font-weight: 800; color: var(--muted);
  transition: box-shadow .2s, color .2s;
}
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button.on { box-shadow: var(--inset-sm); color: var(--accent); }


/* sheet */
.scrim {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(20, 24, 32, .35);
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; z-index: 21; left: 0; right: 0; bottom: 0;
  max-width: 480px; margin: 0 auto;
  background: var(--bg);
  border-radius: 32px 32px 0 0;
  padding: 12px 20px calc(env(safe-area-inset-bottom) + 20px);
  box-shadow: 0 -10px 40px rgba(0,0,0,.18);
  transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.9,.25,1);
}
.sheet.on { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--lo); margin: 0 auto 16px; }
.sheet .num input { height: 76px; font-size: 38px; }
.sheet .acts { display: grid; grid-template-columns: 1fr 1.6fr; gap: 14px; margin-top: 20px; }

.toast {
  position: fixed; z-index: 30; left: 50%;
  top: calc(env(safe-area-inset-top) + 12px);
  transform: translate(-50%, -140%);
  padding: 12px 20px; border-radius: 99px;
  background: var(--bg); box-shadow: var(--raise-sm);
  font-weight: 800; font-size: 15px;
  display: flex; align-items: center; gap: 8px;
  transition: transform .3s cubic-bezier(.2,.9,.25,1);
}
.toast.on { transform: translate(-50%, 0); }
.toast svg { width: 18px; height: 18px; color: var(--c-normal); }
</style>
</head>
<body>
<main>
  <!-- LOG -->
  <section class="view on" id="v-log">
    <header class="top">
      <div>
        <h1>Blood Pressure</h1>
        <div class="sub" id="today"></div>
      </div>
      <button class="me" id="me" aria-label="Account"></button>
    </header>

    <div class="card">
      <div class="nums">
        <div class="num sys"><label for="sys">SYS</label><input id="sys" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="120" autocomplete="off"></div>
        <div class="num dia"><label for="dia">DIA</label><input id="dia" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="80" autocomplete="off"></div>
        <div class="num pul"><label for="pul">PULSE</label><input id="pul" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="70" autocomplete="off"></div>
      </div>
      <div class="chiprow"><span class="chip" id="chip"><b></b></span></div>
      <div class="row2">
        <input class="field" id="when" type="datetime-local" aria-label="Date and time">
        <input class="field" id="note" type="text" placeholder="Note" maxlength="140" autocomplete="off" enterkeyhint="done">
      </div>
      <button class="btn primary save" id="save">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Save
      </button>
    </div>

    <div class="card" id="lastCard" hidden>
      <div class="last">
        <div>
          <div class="k">LAST READING</div>
          <div class="v" id="lastV"></div>
          <div class="when" id="lastW"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- HISTORY -->
  <section class="view" id="v-hist">
    <header class="top">
      <h1>History</h1>
      <button class="ibtn" id="pdf" aria-label="Download PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>
        PDF
      </button>
    </header>

    <div class="seg" id="range">
      <button data-r="7">7D</button>
      <button data-r="30" class="on">30D</button>
      <button data-r="90">90D</button>
      <button data-r="0">All</button>
    </div>

    <div id="histBody">
      <div class="card stats">
        <div><div class="k">BLOOD PRESSURE</div><div class="v" id="avgBp">–</div></div>
        <div><div class="k">PULSE</div><div class="v" id="avgP">–</div></div>
        <div><div class="k">COUNT</div><div class="v" id="cnt">0</div></div>
      </div>
      <div class="card chart" id="chartCard">
        <div class="chead">
          <span class="u" id="cunit"></span>
          <span class="legend"><span><i style="background:var(--accent)"></i>SYS</span><span><i style="background:var(--dia)"></i>DIA</span></span>
        </div>
        <svg id="chart" preserveAspectRatio="none"></svg>
        <div class="cdetail" id="cdetail"></div>
      </div>
      <div id="list"></div>
    </div>
    <div class="empty" id="empty" hidden>No readings</div>
  </section>
</main>

<nav class="tabs">
  <button class="on" data-v="log">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Log
  </button>
  <button data-v="hist">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></svg>
    History
  </button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Edit reading">
  <div class="grab"></div>
  <div class="nums">
    <div class="num sys"><label for="e-sys">SYS</label><input id="e-sys" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off"></div>
    <div class="num dia"><label for="e-dia">DIA</label><input id="e-dia" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off"></div>
    <div class="num pul"><label for="e-pul">PULSE</label><input id="e-pul" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off"></div>
  </div>
  <div class="row2">
    <input class="field" id="e-when" type="datetime-local" aria-label="Date and time">
    <input class="field" id="e-note" type="text" placeholder="Note" maxlength="140" autocomplete="off" enterkeyhint="done">
  </div>
  <div class="acts">
    <button class="btn" id="e-cancel">Cancel</button>
    <button class="btn primary" id="e-save">Save</button>
  </div>
</div>

<div class="confirm" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="cf-t">
  <h2 id="cf-t">Delete reading?</h2>
  <p id="cf-d"></p>
  <div class="acts">
    <button class="btn" id="cf-no">Cancel</button>
    <button class="btn danger-fill" id="cf-yes">Delete</button>
  </div>
</div>

<div class="confirm" id="acct" role="dialog" aria-modal="true" aria-labelledby="a-name">
  <h2 id="a-name"></h2>
  <p id="a-stat"></p>
  <div class="acts">
    <button class="btn" id="a-out">Sign out</button>
    <button class="btn primary" id="a-close">Done</button>
  </div>
</div>

<div class="welcome" id="welcome" hidden>
  <div class="wbox">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></svg></div>
    <h1>What's your name?</h1>
    <input class="field" id="w-name" type="text" autocomplete="name" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="40" aria-label="Your name">
    <button class="btn primary" id="w-go">Continue</button>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  <span></span>
</div>

<script src="jspdf.umd.min.js" defer></script>
<script>
(() => {
  const KEY = 'bp.readings.v1';
  const DAY = 864e5;
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];

  // ---------- data ----------
  let readings = load();
  function load() {
    try {
      const a = JSON.parse(localStorage.getItem(KEY));
      return Array.isArray(a) ? a.filter((r) => r && r.sys && r.dia && r.t).sort((x, y) => y.t - x.t) : [];
    } catch { return []; }
  }
  function persist() {
    readings.sort((a, b) => b.t - a.t);
    try { localStorage.setItem(KEY, JSON.stringify(readings)); } catch {}
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // ---------- categories (ACC/AHA) ----------
  const CATS = {
    normal:   { label: 'Normal' },
    elevated: { label: 'Elevated' },
    stage1:   { label: 'High · Stage 1', pdf: 'High - Stage 1' },
    stage2:   { label: 'High · Stage 2', pdf: 'High - Stage 2' },
    crisis:   { label: 'Crisis' },
  };
  function cat(s, d) {
    if (s > 180 || d > 120) return CATS.crisis;
    if (s >= 140 || d >= 90) return CATS.stage2;
    if (s >= 130 || d >= 80) return CATS.stage1;
    if (s >= 120) return CATS.elevated;
    return CATS.normal;
  }

  // ---------- formatting ----------
  const fDay = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  const fDayShort = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  const fDayYear = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  const fTime = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
  const fDate = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  const toLocalInput = (ms) => {
    const d = new Date(ms);
    return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
  };
  const fromLocalInput = (v) => { const t = new Date(v).getTime(); return isNaN(t) ? null : t; };
  function dayLabel(t) {
    const d0 = new Date(); d0.setHours(0, 0, 0, 0);
    const diff = Math.round((d0 - new Date(t).setHours(0, 0, 0, 0)) / DAY);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return new Date(t).getFullYear() === d0.getFullYear() ? fDayShort.format(t) : fDayYear.format(t);
  }
  function ago(t) {
    const m = Math.round((Date.now() - t) / 6e4);
    if (m < 1) return 'Just now';
    if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    return dayLabel(t) + ', ' + fTime.format(t);
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const heart = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>';

  // ---------- validation ----------
  function readFields(p) {
    const n = (k) => { const v = $('#' + p + k).value.trim(); return v === '' ? null : parseInt(v, 10); };
    const sys = n('sys'), dia = n('dia'), pul = n('pul');
    const bad = [];
    if (!(sys >= 50 && sys <= 300)) bad.push('sys');
    if (!(dia >= 25 && dia <= 200) || (sys && dia >= sys)) bad.push('dia');
    if (pul !== null && !(pul >= 20 && pul <= 260)) bad.push('pul');
    return { sys, dia, pul, bad };
  }
  function flag(p, bad) {
    bad.forEach((k) => {
      const el = $('#' + p + k).parentElement;
      el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad');
      setTimeout(() => el.classList.remove('bad'), 1400);
    });
    if (bad.length) $('#' + p + bad[0]).focus();
  }

  // digits only + auto-advance
  function wireNums(p, after) {
    const order = ['sys', 'dia', 'pul'];
    order.forEach((k, i) => {
      const el = $('#' + p + k);
      el.addEventListener('input', () => {
        const v = el.value.replace(/\D/g, '').slice(0, 3);
        if (v !== el.value) el.value = v;
        const full = v.length === 3 || (v.length === 2 && v[0] >= '3');
        if (full && i < order.length - 1) $('#' + p + order[i + 1]).focus();
        after && after();
      });
    });
  }

  // ---------- log view ----------
  let whenTouched = false;
  const when = $('#when');
  function resetWhen() { whenTouched = false; when.value = toLocalInput(Date.now()); }
  when.addEventListener('input', () => { whenTouched = true; });
  setInterval(() => { if (!whenTouched && document.activeElement !== when) when.value = toLocalInput(Date.now()); }, 20000);

  function updateChip() {
    const s = parseInt($('#sys').value, 10), d = parseInt($('#dia').value, 10);
    const chip = $('#chip');
    if (s >= 50 && d >= 25 && $('#dia').value.length >= 2 && d < s) {
      const c = cat(s, d);
      chip.querySelector('b').textContent = c.label;
      chip.classList.add('on');
    } else chip.classList.remove('on');
  }
  wireNums('', updateChip);
  $('#note').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });

  $('#save').addEventListener('click', () => {
    const { sys, dia, pul, bad } = readFields('');
    if (bad.length) return flag('', bad);
    const t = whenTouched ? (fromLocalInput(when.value) ?? Date.now()) : Date.now();
    const r = { id: uid(), t, sys, dia, pulse: pul, note: $('#note').value.trim() };
    readings.push(r); change(r);
    persist();
    ['#sys', '#dia', '#pul', '#note'].forEach((s) => ($(s).value = ''));
    document.activeElement && document.activeElement.blur();
    resetWhen(); updateChip(); renderAll();
    toast('Saved');
  });

  function renderLast() {
    const r = readings[0];
    $('#lastCard').hidden = !r;
    if (!r) return;
    $('#lastV').innerHTML = `${r.sys}/${r.dia}` + (r.pulse ? `<span>${r.pulse} bpm</span>` : '');
    $('#lastW').textContent = ago(r.t);
  }

  // ---------- history view ----------
  let range = 30;
  try { const r = localStorage.getItem('bp.range'); if (r !== null) range = +r; } catch {}
  $$('#range button').forEach((b) => {
    b.classList.toggle('on', +b.dataset.r === range);
    b.addEventListener('click', () => {
      range = +b.dataset.r;
      try { localStorage.setItem('bp.range', range); } catch {}
      $$('#range button').forEach((x) => x.classList.toggle('on', x === b));
      renderHist();
    });
  });
  function rangeStart() {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (range - 1));
    return d.getTime();
  }
  const inRange = () => (range ? readings.filter((r) => r.t >= rangeStart()) : readings.slice());
  const avg = (a) => Math.round(a.reduce((s, x) => s + x, 0) / a.length);

  function renderHist() {
    const rs = inRange();
    $('#histBody').hidden = !rs.length;
    $('#empty').hidden = !!rs.length;
    if (!rs.length) return;

    $('#avgBp').textContent = `${avg(rs.map((r) => r.sys))}/${avg(rs.map((r) => r.dia))}`;
    const ps = rs.map((r) => r.pulse).filter(Boolean);
    $('#avgP').innerHTML = ps.length ? `${avg(ps)}` : '–';
    $('#cnt').textContent = rs.length;

    renderChart(rs);

    let html = '', last = '';
    for (const r of rs) {
      const dl = dayLabel(r.t);
      if (dl !== last) { html += `<div class="day">${dl}</div>`; last = dl; }
      const c = cat(r.sys, r.dia);
      html += `<div class="rec${r.id === openId ? ' open' : ''}" data-id="${r.id}"><button class="item">
        <div class="bp">${r.sys}/${r.dia}</div>
        <div class="meta"><div class="t">${fTime.format(r.t)}</div>${r.note ? `<div class="n">${esc(r.note)}</div>` : `<div class="n">${c.label}</div>`}</div>
        ${r.pulse ? `<div class="p">${heart}${r.pulse}</div>` : ''}
      </button><div class="racts"><div><div class="row">
        <button class="ico edit" aria-label="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></button>
        <button class="ico del" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
      </div></div></div></div>`;
    }
    $('#list').innerHTML = html;
  }
  // tap a record to reveal edit / delete
  let openId = null;
  $('#list').addEventListener('click', (e) => {
    const rec = e.target.closest('.rec');
    if (!rec) return;
    const id = rec.dataset.id;
    if (e.target.closest('.edit')) return openSheet(id);
    if (e.target.closest('.del')) return askDelete(id);
    openId = openId === id ? null : id;
    $$('#list .rec').forEach((x) => x.classList.toggle('open', x.dataset.id === openId));
  });

  // ---------- chart: one column per day / week / month; tap or drag to see that period's readings ----------
  const CL = 30, CR = 4;
  const fWd = new Intl.DateTimeFormat(undefined, { weekday: 'short' });
  const fMd = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' });
  const fMon = new Intl.DateTimeFormat(undefined, { month: 'short' });
  const fMonYs = new Intl.DateTimeFormat(undefined, { month: 'short', year: '2-digit' });
  const fMonY = new Intl.DateTimeFormat(undefined, { month: 'long', year: 'numeric' });
  const fWdTime = new Intl.DateTimeFormat(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' });
  const fMdTime = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  let chartModel = null, chartSel = null;

  function buildSlots(rs) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const first = new Date(range ? rangeStart() : (rs.length ? rs[rs.length - 1].t : Date.now()));
    first.setHours(0, 0, 0, 0);
    const days = Math.round((today - first) / DAY) + 1;
    const unit = days <= 31 ? 'day' : days <= 190 ? 'week' : 'month';
    const d = new Date(first);
    if (unit === 'week') d.setDate(d.getDate() - d.getDay());
    if (unit === 'month') d.setDate(1);
    const slots = [];
    while (d <= today) {
      const s0 = d.getTime();
      if (unit === 'day') d.setDate(d.getDate() + 1);
      else if (unit === 'week') d.setDate(d.getDate() + 7);
      else d.setMonth(d.getMonth() + 1);
      slots.push({ s: s0, e: d.getTime(), items: [] });
    }
    for (const r of rs) { const sl = slots.find((x) => r.t >= x.s && r.t < x.e); if (sl) sl.items.unshift(r); }
    const multiYear = slots.length && new Date(slots[0].s).getFullYear() !== today.getFullYear();
    return { unit, slots, multiYear };
  }

  function renderChart(rs) {
    const svg = $('#chart');
    const m = (chartModel = buildSlots(rs));
    const { slots, unit } = m;
    $('#cunit').textContent = { day: 'By day', week: 'By week', month: 'By month' }[unit];
    if (!slots.some((x) => x.s === chartSel && x.items.length)) {
      const last = [...slots].reverse().find((x) => x.items.length);
      if (!slots.some((x) => x.s === chartSel)) chartSel = last ? last.s : null;
    }
    const W = Math.max(svg.clientWidth || 360, 200), H = 200, T = 8, B = 26;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    let lo = Math.min(...rs.map((p) => p.dia)), hi = Math.max(...rs.map((p) => p.sys));
    lo = Math.floor((lo - 8) / 10) * 10; hi = Math.ceil((hi + 8) / 10) * 10;
    const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const n = slots.length, cw = (W - CL - CR) / n;
    let g = '';
    const step = hi - lo > 80 ? 40 : 20;
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      g += `<line x1="${CL}" x2="${W - CR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--lo)" stroke-width="1" opacity=".7"/>
            <text x="${CL - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" font-weight="700" fill="var(--muted)">${v}</text>`;
    }
    [120, 80].forEach((v) => {
      if (v > lo && v < hi) g += `<line x1="${CL}" x2="${W - CR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4" opacity=".6"/>`;
    });
    const bw = Math.max(4, Math.min(cw * 0.5, 16)), dr = Math.max(2.2, Math.min(cw * 0.16, 4));
    slots.forEach((sl, i) => {
      const cx = CL + (i + 0.5) * cw, on = sl.s === chartSel;
      if (on) g += `<rect x="${CL + i * cw + 1}" y="${T - 4}" width="${Math.max(cw - 2, 2)}" height="${H - T - B + 8}" rx="${Math.min(10, cw / 2)}" fill="var(--lo)" opacity=".45"/>`;
      if (!sl.items.length) return;
      const top = y(Math.max(...sl.items.map((r) => r.sys))), bot = y(Math.min(...sl.items.map((r) => r.dia)));
      g += `<rect x="${cx - bw / 2}" y="${top - bw / 2}" width="${bw}" height="${bot - top + bw}" rx="${bw / 2}" fill="var(--accent)" opacity="${on ? 0.24 : 0.12}"/>`;
      for (const r of sl.items) g += `<circle cx="${cx}" cy="${y(r.sys)}" r="${dr}" fill="var(--accent)"/><circle cx="${cx}" cy="${y(r.dia)}" r="${dr}" fill="var(--dia)"/>`;
    });
    const every = Math.ceil(n / Math.max(2, Math.floor((W - CL - CR) / 56)));
    slots.forEach((sl, i) => {
      if ((n - 1 - i) % every) return;
      const d = new Date(sl.s), on = sl.s === chartSel;
      const txt = unit === 'day' ? (n <= 7 ? fWd.format(d) : fMd.format(d)) : unit === 'week' ? fMd.format(d) : (m.multiYear ? fMonYs.format(d) : fMon.format(d));
      g += `<text x="${CL + (i + 0.5) * cw}" y="${H - 6}" text-anchor="middle" font-size="11" font-weight="${on ? 800 : 700}" fill="${on ? 'var(--accent)' : 'var(--muted)'}">${txt}</text>`;
    });
    svg.innerHTML = g;
    renderDetail();
  }

  function renderDetail() {
    const box = $('#cdetail');
    const sl = chartModel && chartModel.slots.find((x) => x.s === chartSel);
    if (!sl) { box.innerHTML = ''; return; }
    const u = chartModel.unit;
    const title = u === 'day' ? dayLabel(sl.s)
      : u === 'week' ? `${fMd.format(sl.s)} – ${fMd.format(sl.e - 1)}`
      : fMonY.format(sl.s);
    const it = sl.items;
    if (!it.length) { box.innerHTML = `<div class="dt">${title}</div><div class="ds">No readings</div>`; return; }
    let sub = `${it.length} reading${it.length > 1 ? 's' : ''}`;
    if (it.length > 1) {
      const by = (a, b) => a.sys - b.sys || a.dia - b.dia;
      const hiR = it.reduce((a, r) => (by(r, a) > 0 ? r : a)), loR = it.reduce((a, r) => (by(r, a) < 0 ? r : a));
      sub += ` · Highest ${hiR.sys}/${hiR.dia} · Lowest ${loR.sys}/${loR.dia}`;
    }
    const tf = u === 'day' ? fTime : u === 'week' ? fWdTime : fMdTime;
    box.innerHTML = `<div class="dt">${title}</div><div class="ds">${sub}</div><div class="chips">` +
      it.map((r) => `<div class="cp"><div class="ct">${tf.format(r.t)}</div><div class="cv">${r.sys}/${r.dia}</div>${r.pulse ? `<div class="cpu">${heart}${r.pulse}</div>` : ''}</div>`).join('') +
      `</div>`;
  }

  (() => {
    const svg = $('#chart'); let down = false;
    const pick = (e) => {
      if (!chartModel || !chartModel.slots.length) return;
      const b = svg.getBoundingClientRect(), W = svg.viewBox.baseVal.width || b.width, n = chartModel.slots.length;
      const x = (e.clientX - b.left) * (W / b.width);
      const i = Math.max(0, Math.min(n - 1, Math.floor((x - CL) / ((W - CL - CR) / n))));
      const s0 = chartModel.slots[i].s;
      if (s0 !== chartSel) { chartSel = s0; renderChart(inRange()); }
    };
    svg.addEventListener('pointerdown', (e) => { down = true; pick(e); });
    svg.addEventListener('pointermove', (e) => { if (down) pick(e); });
    addEventListener('pointerup', () => (down = false));
    addEventListener('pointercancel', () => (down = false));
  })();

  // ---------- edit sheet ----------
  let editing = null, deleting = null;
  function openSheet(id) {
    const r = readings.find((x) => x.id === id);
    if (!r) return;
    editing = r;
    $('#e-sys').value = r.sys; $('#e-dia').value = r.dia; $('#e-pul').value = r.pulse || '';
    $('#e-when').value = toLocalInput(r.t); $('#e-note').value = r.note || '';
    $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
  }
  function closeSheet() {
    document.activeElement && document.activeElement.blur();
    $('#scrim').classList.remove('on');
    ['#sheet', '#confirm', '#acct'].forEach((x) => $(x).classList.remove('on'));
    editing = null; deleting = null;
  }
  $('#e-cancel').addEventListener('click', closeSheet);
  function askDelete(id) {
    const r = readings.find((x) => x.id === id);
    if (!r) return;
    deleting = r;
    $('#cf-d').textContent = `${r.sys}/${r.dia}  ·  ${dayLabel(r.t)}, ${fTime.format(r.t)}`;
    $('#scrim').classList.add('on'); $('#confirm').classList.add('on');
  }
  $('#cf-no').addEventListener('click', closeSheet);
  $('#cf-yes').addEventListener('click', () => {
    if (!deleting) return;
    readings = readings.filter((x) => x.id !== deleting.id);
    change(deleting, true);
    openId = null;
    persist(); closeSheet(); renderAll(); toast('Deleted');
  });
  $('#scrim').addEventListener('click', closeSheet);
  wireNums('e-');
  $('#e-note').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
  $('#e-save').addEventListener('click', () => {
    if (!editing) return;
    const { sys, dia, pul, bad } = readFields('e-');
    if (bad.length) return flag('e-', bad);
    // sync may have swapped in fresh objects while the sheet was open, so edit by id
    let r = readings.find((x) => x.id === editing.id);
    if (!r) readings.push((r = editing));
    Object.assign(r, { sys, dia, pulse: pul, note: $('#e-note').value.trim(), t: fromLocalInput($('#e-when').value) ?? r.t });
    change(r);
    openId = null;
    persist(); closeSheet(); renderAll(); toast('Updated');
  });
  // swipe sheet down to close
  (() => {
    const sh = $('#sheet'); let y0 = null, dy = 0;
    sh.addEventListener('touchstart', (e) => { if (e.target.closest('input,button')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive: true });
    sh.addEventListener('touchmove', (e) => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
    sh.addEventListener('touchend', () => { if (y0 === null) return; sh.style.transition = ''; sh.style.transform = ''; if (dy > 90) closeSheet(); y0 = null; });
  })();
  // keep sheet above the iOS keyboard
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const fit = () => { $('#sheet').style.bottom = Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + 'px'; };
    vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit);
  }

  // ---------- tabs ----------
  $$('nav.tabs button').forEach((b) => b.addEventListener('click', () => {
    $$('nav.tabs button').forEach((x) => x.classList.toggle('on', x === b));
    $$('.view').forEach((v) => v.classList.toggle('on', v.id === 'v-' + b.dataset.v));
    window.scrollTo(0, 0);
    if (b.dataset.v === 'hist') renderHist(); else renderLast();
  }));

  // ---------- toast ----------
  let tt;
  function toast(msg) {
    const t = $('#toast'); t.querySelector('span').textContent = msg;
    t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1600);
  }

  // ---------- PDF ----------
  $('#pdf').addEventListener('click', async () => {
    const rs = inRange().sort((a, b) => a.t - b.t);
    if (!rs.length) return toast('Nothing to export');
    if (!window.jspdf) return toast('PDF not ready');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const PW = doc.internal.pageSize.getWidth(), PH = doc.internal.pageSize.getHeight(), M = 48;
    const ink = [43, 52, 69], mute = [130, 140, 156], line = [222, 227, 235];

    doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.setTextColor(...ink);
    doc.text('Blood Pressure Log', M, M + 10);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(...mute);
    doc.text(`${fDate.format(rs[0].t)} - ${fDate.format(rs[rs.length - 1].t)}   |   ${rs.length} reading${rs.length > 1 ? 's' : ''}   |   Generated ${fDate.format(Date.now())}`, M, M + 30);

    // summary boxes
    const ps = rs.map((r) => r.pulse).filter(Boolean);
    const hiR = rs.reduce((a, r) => (r.sys > a.sys ? r : a)), loR = rs.reduce((a, r) => (r.sys < a.sys ? r : a));
    const boxes = [
      ['BLOOD PRESSURE', `${avg(rs.map((r) => r.sys))}/${avg(rs.map((r) => r.dia))}`, 'mmHg'],
      ['PULSE', ps.length ? String(avg(ps)) : '-', ps.length ? 'bpm' : ''],
      ['HIGHEST', `${hiR.sys}/${hiR.dia}`, 'mmHg'],
      ['LOWEST', `${loR.sys}/${loR.dia}`, 'mmHg'],
    ];
    const bw = (PW - 2 * M - 3 * 10) / 4, by = M + 46;
    boxes.forEach(([k, v, u], i) => {
      const bx = M + i * (bw + 10);
      doc.setFillColor(242, 245, 249); doc.roundedRect(bx, by, bw, 58, 8, 8, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...mute); doc.text(k, bx + 12, by + 18);
      doc.setFontSize(18); doc.setTextColor(...ink); doc.text(v, bx + 12, by + 42);
      if (u) { const w = doc.getTextWidth(v); doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...mute); doc.text(u, bx + 16 + w, by + 42); }
    });

    const cols = [
      { h: 'DATE', x: M, w: 108 },
      { h: 'TIME', x: M + 108, w: 62 },
      { h: 'SYS', x: M + 170, w: 40, r: true },
      { h: 'DIA', x: M + 210, w: 40, r: true },
      { h: 'PULSE', x: M + 250, w: 46, r: true },
      { h: 'CATEGORY', x: M + 312, w: 96 },
      { h: 'NOTE', x: M + 410, w: PW - M - (M + 410) },
    ];
    const RH = 22;
    const head = (y) => {
      doc.setFillColor(...ink); doc.roundedRect(M, y, PW - 2 * M, RH, 4, 4, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(255, 255, 255);
      cols.forEach((c) => doc.text(c.h, c.r ? c.x + c.w : c.x + 8, y + 14.5, c.r ? { align: 'right' } : undefined));
      return y + RH;
    };
    const fDateP = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    let y = head(by + 80);
    rs.forEach((r, i) => {
      if (y + RH > PH - M) { doc.addPage(); y = head(M); }
      if (i % 2) { doc.setFillColor(247, 249, 252); doc.rect(M, y, PW - 2 * M, RH, 'F'); }
      doc.setDrawColor(...line); doc.setLineWidth(0.5); doc.line(M, y + RH, PW - M, y + RH);
      const c = cat(r.sys, r.dia);
      const ty = y + 14.5;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...ink);
      doc.text(fDateP.format(r.t), M + 8, ty);
      doc.text(fTime.format(r.t), cols[1].x + 8, ty);
      doc.setFont('helvetica', 'bold');
      doc.text(String(r.sys), cols[2].x + cols[2].w, ty, { align: 'right' });
      doc.text(String(r.dia), cols[3].x + cols[3].w, ty, { align: 'right' });
      doc.setFont('helvetica', 'normal');
      doc.text(r.pulse ? String(r.pulse) : '-', cols[4].x + cols[4].w, ty, { align: 'right' });
      doc.text(c.pdf || c.label, cols[5].x + 8, ty);
      if (r.note) {
        doc.setTextColor(...mute);
        let n = r.note.replace(/[^\x20-\x7E -ÿ]/g, '');
        const maxW = cols[6].w - 8;
        if (doc.getTextWidth(n) > maxW) { while (n && doc.getTextWidth(n + '...') > maxW) n = n.slice(0, -1); n += '...'; }
        doc.text(n, cols[6].x + 8, ty);
      }
      y += RH;
    });
    const pages = doc.getNumberOfPages();
    for (let p = 1; p <= pages; p++) {
      doc.setPage(p); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...mute);
      doc.text(`Page ${p} of ${pages}`, PW - M, PH - 24, { align: 'right' });
    }

    await saveFile(doc.output('blob'), `blood-pressure-${stamp()}.pdf`, 'application/pdf');
  });

  // ---------- files ----------
  function stamp() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  // iPhone: share sheet (Save to Files / iCloud Drive). Elsewhere: download.
  // Resolves true unless the share sheet was dismissed.
  async function saveFile(blob, name, type) {
    const file = new File([blob], name, { type });
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return true; }
      catch (e) { if (e && e.name === 'AbortError') return false; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return true;
  }

  // ---------- account + cloud sync ----------
  // The phone keeps a local copy (works offline); every change is queued and
  // pushed to the server, and the server's full list comes back each time.
  const UKEY = 'bp.user.v1', PKEY = 'bp.pending.v1';
  let user = null, pending = {}, syncState = 'ok', syncing = false, again = false, st;
  try { user = JSON.parse(localStorage.getItem(UKEY)); } catch {}
  try { pending = JSON.parse(localStorage.getItem(PKEY)) || {}; } catch {}
  const savePending = () => { try { localStorage.setItem(PKEY, JSON.stringify(pending)); } catch {} };
  const hasPending = () => Object.keys(pending).length > 0;

  function change(r, deleted = false) {
    r.u = Date.now();
    pending[r.id] = deleted ? { ...r, deleted: true } : { ...r };
    savePending(); setSync('saving'); syncSoon();
  }
  function syncSoon(ms = 400) { clearTimeout(st); st = setTimeout(sync, ms); }

  async function sync() {
    if (!user) return;
    if (syncing) { again = true; return; }
    syncing = true;
    const me = user, batch = Object.values(pending);
    try {
      const res = await fetch('api/sync', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ user: user.id, changes: batch }),
      });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      if (user !== me) return; // signed out (or switched) while this was in flight
      for (const c of batch) if (pending[c.id] && pending[c.id].u === c.u) delete pending[c.id];
      savePending();
      const map = new Map(data.readings.map((r) => [r.id, r]));
      for (const p of Object.values(pending)) p.deleted ? map.delete(p.id) : map.set(p.id, p);
      const next = [...map.values()].map(({ deleted, ...r }) => r).sort((a, b) => b.t - a.t);
      const sig = (a) => a.map((r) => r.id + ':' + r.u).join(',');
      if (sig(next) !== sig(readings)) { readings = next; persist(); renderAll(); }
      setSync(hasPending() ? 'saving' : 'ok');
      if (hasPending()) again = true;
    } catch {
      if (user === me) setSync(navigator.onLine ? 'error' : 'offline');
    } finally {
      syncing = false;
      if (again && user) { again = false; syncSoon(1500); }
    }
  }

  const SYNC_TEXT = { ok: 'Saved to cloud', saving: 'Saving…', offline: 'Offline · saves when back online', error: "Couldn't reach the cloud · will retry" };
  function setSync(state) {
    syncState = state;
    $('#me').classList.toggle('pending', hasPending());
    $('#a-stat').textContent = SYNC_TEXT[state];
  }

  function showWelcome() {
    $('#welcome').hidden = false;
    $('#w-name').value = '';
  }
  async function login() {
    const name = $('#w-name').value.trim().replace(/\s+/g, ' ');
    if (!name) { const el = $('#w-name'); el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad'); return el.focus(); }
    const go = $('#w-go'); go.disabled = true; go.textContent = '…';
    try {
      const res = await fetch('api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
      if (!res.ok) throw new Error(res.status);
      const u = await res.json();
      user = { id: u.id, name: u.name };
      try { localStorage.setItem(UKEY, JSON.stringify(user)); } catch {}
      // readings logged before cloud saving existed get uploaded once
      if (readings.length && !hasPending()) readings.forEach((r) => change(r));
      document.activeElement && document.activeElement.blur();
      $('#welcome').hidden = true;
      renderMe(); sync();
      toast(u.created ? `Hi, ${u.name.split(' ')[0]}` : `Welcome back, ${u.name.split(' ')[0]}`);
    } catch {
      toast(navigator.onLine ? 'Try again' : 'No connection');
    } finally {
      go.disabled = false; go.textContent = 'Continue';
    }
  }
  $('#w-go').addEventListener('click', login);
  $('#w-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); login(); } });

  function renderMe() { $('#me').textContent = user ? (user.name.trim()[0] || '?').toUpperCase() : ''; }
  $('#me').addEventListener('click', () => {
    if (!user) return;
    $('#a-name').textContent = user.name;
    setSync(syncState);
    $('#scrim').classList.add('on'); $('#acct').classList.add('on');
    sync();
  });
  $('#a-close').addEventListener('click', closeSheet);
  $('#a-out').addEventListener('click', async () => {
    if (hasPending()) { await sync(); if (hasPending()) return toast('Not saved yet'); }
    user = null; readings = []; pending = {};
    try { [UKEY, PKEY, KEY].forEach((k) => localStorage.removeItem(k)); } catch {}
    closeSheet(); renderMe(); renderAll(); renderHist(); showWelcome();
  });

  addEventListener('online', () => sync());
  setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 60000);

  // ---------- boot ----------
  // iOS only applies :active (the pressed look) when a touch listener exists
  document.addEventListener('touchstart', () => {}, { passive: true });
  function renderAll() { renderLast(); if ($('#v-hist').classList.contains('on')) renderHist(); }
  $('#today').textContent = fDay.format(Date.now());
  resetWhen(); renderAll(); renderHist(); renderMe();
  if (user) { setSync(hasPending() ? 'saving' : 'ok'); sync(); } else showWelcome();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    $('#today').textContent = fDay.format(Date.now());
    if (!whenTouched) resetWhen();
    renderAll(); sync();
  });
  let rw; addEventListener('resize', () => { clearTimeout(rw); rw = setTimeout(() => { if ($('#v-hist').classList.contains('on')) renderChart(inRange()); }, 150); });

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
